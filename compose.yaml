services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mundial
      POSTGRES_USER: mundial
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mundial -d mundial"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://mundial:${DB_PASSWORD}@db:5432/mundial
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    deploy:
      replicas: 2
  proxy:
    image: nginx:1.31-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
volumes:
  postgres_data:
