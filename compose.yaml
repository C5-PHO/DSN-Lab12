services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mundial
      POSTGRES_USER: mundial
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mundial -d mundial"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://mundial:${DB_PASSWORD}@db:5432/mundial
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 2
  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
volumes:
  postgres_data:
